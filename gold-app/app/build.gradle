plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mostafa.goldtracker'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mostafa.goldtracker'
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName '2.5'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
