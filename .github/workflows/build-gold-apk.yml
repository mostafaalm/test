name: Build Gold Tracker APK

on:
  push:
    branches: [main]
    paths: ['gold-app/**', '.github/workflows/build-gold-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: gold-app
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp gold-app/app/build/outputs/apk/debug/app-debug.apk gold-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gold-tracker-apk
          path: gold-tracker.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gold-v${{ github.run_number }}
          name: متابعة الدهب ${{ github.run_number }}
          target_commitish: main
          files: gold-tracker.apk
